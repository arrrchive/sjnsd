<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>아이폰 풀스크린 시뮬레이터</title>
    <style>
        /* 전체 PC/모바일 공통 초기화 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
        }

        /* PC 화면일 때의 아이폰 프레임 디자인 */
        .iphone-frame {
            width: 380px;
            height: 780px;
            background-color: #000;
            border-radius: 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 10px #333;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 내부 스크린 화면 (시간과 날짜가 포함된 원본 사진 그대로 출력) */
        .iphone-screen {
            flex: 1;
            background: url('IMG_0191.jpg') no-repeat center center;
            background-size: cover; /* 양옆 공백 없이 화면에 꽉 채우기 */
            margin: 12px;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }

        /* 📱 스마트폰(모바일 기기)에서 접속했을 때 꽉 차게 조절 */
        @media screen and (max-width: 480px) {
            body {
                background-color: #000;
            }

            .iphone-frame {
                width: 100vw;
                height: 100vh;
                height: 100svh;
                border-radius: 0;
                box-shadow: none;
                background-color: #000;
            }

            .iphone-screen {
                margin: 0;
                border-radius: 0;
                width: 100%;
                height: 100%;
                background-size: cover;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <!-- 내부 화면 (사진 원본 그대로 배경 적용) -->
        <div class="iphone-screen"></div>
    </div>

</body>
</html>
